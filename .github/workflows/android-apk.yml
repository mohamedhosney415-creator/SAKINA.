
name: SAKINA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SAKINA APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Show versions
      - name: Check environment
        run: |
          flutter --version
          java -version
          python3 --version

      # 5. Generate Android project
      - name: Generate Android platform
        run: |
          flutter create \
            --org com.hosny \
            --project-name sakina \
            --platforms=android .

      # 6. Remove default test folder
      - name: Prepare project
        run: |
          rm -rf test

      # 7. Apply SAKINA Android configuration
      - name: Patch Android project
        run: |
          python3 tool/patch_android.py

      # 8. Install dependencies
      - name: Get Flutter dependencies
        run: |
          flutter pub get

      # 9. Analyze project
      - name: Analyze Flutter project
        run: |
          flutter analyze --no-pub || true

      # 10. Display Android Gradle configuration
      - name: Check Android Gradle files
        run: |
          echo "===== ROOT GRADLE ====="
          cat android/build.gradle.kts || true
          echo "===== APP GRADLE ====="
          cat android/app/build.gradle.kts || true
          echo "===== ANDROID PROJECTS ====="
          find android -maxdepth 2 -type f -name "*.gradle*" -print

      # 11. Build APK with verbose diagnostics
      - name: Build APK with detailed logs
        run: |
          flutter build apk --release --verbose

      # 12. Upload APK
      - name: Upload SAKINA APK
        uses: actions/upload-artifact@v4
        with:
          name: SAKINA-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
