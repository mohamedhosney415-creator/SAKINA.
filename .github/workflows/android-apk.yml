
name: SAKINA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SAKINA APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Check environment
      - name: Check environment
        run: |
          flutter --version
          java -version
          python3 --version

      # 5. Generate Android project
      - name: Generate Android platform
        run: |
          flutter create \
            --org com.hosny \
            --project-name sakina \
            --platforms=android .

      # 6. Prepare project
      - name: Prepare project
        run: |
          rm -rf test

      # 7. Apply SAKINA Android configuration
      - name: Patch Android project
        run: |
          python3 tool/patch_android.py

      # 8. Install dependencies
      - name: Get Flutter dependencies
        run: |
          flutter pub get

      # 9. Analyze Flutter project
      - name: Analyze Flutter project
        run: |
          flutter analyze --no-pub || true

      # 10. Check Android Gradle configuration
      - name: Check Android Gradle files
        run: |
          echo "===== ROOT GRADLE ====="
          cat android/build.gradle.kts || cat android/build.gradle || true

          echo "===== APP GRADLE ====="
          cat android/app/build.gradle.kts || cat android/app/build.gradle || true

          echo "===== ANDROID PROJECT FILES ====="
          find android -maxdepth 3 -type f -name "*.gradle*" -print

      # 11. Build APK and save complete log
      - name: Build APK with diagnostics
        shell: bash
        run: |
          set +e

          flutter build apk --release --verbose > build.log 2>&1

          BUILD_EXIT=$?

          echo ""
          echo "================================"
          echo "SAKINA BUILD ERROR SUMMARY"
          echo "================================"

          grep -niE \
            "FAILURE:|What went wrong|Caused by:|Exception|Error:|failed|Could not|Unable to" \
            build.log | tail -n 100 || true

          echo ""
          echo "================================"
          echo "LAST 150 BUILD LOG LINES"
          echo "================================"

          tail -n 150 build.log

          echo ""
          echo "Build exit code: $BUILD_EXIT"

          exit "$BUILD_EXIT"

      # 12. Upload diagnostic log even if build fails
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAKINA-build-diagnostics
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 13. Upload APK if build succeeds
      - name: Upload SAKINA APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAKINA-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
