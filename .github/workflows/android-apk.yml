
name: Build SAKINA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Generate Android project
        run: |
          flutter create \
            --org com.hosny \
            --project-name sakina \
            --platforms=android .

      - name: Remove default test
        run: rm -rf test

      # Important: plugin metadata and plugin folders are needed
      # by tool/patch_android.py, so pub get must run first.
      - name: Get Flutter packages
        run: flutter pub get

      - name: Patch Android project and plugin compileSdk
        run: |
          python3 tool/patch_android.py

      - name: Verify Android SDK configuration
        run: |
          echo "Checking app compileSdk..."
          grep -nE 'compileSdk(Version)?' android/app/build.gradle* || true

          echo "Checking plugin compileSdk declarations..."
          grep -R -nE 'compileSdk(Version)?' \
            "$HOME/.pub-cache/hosted/pub.dev/file_picker-"*/android \
            "$HOME/.pub-cache/hosted/pub.dev/flutter_plugin_android_lifecycle-"*/android \
            2>/dev/null || true

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK with diagnostics
        id: build_apk
        shell: bash
        run: |
          set +e

          flutter build apk --release --verbose > build.log 2>&1
          BUILD_EXIT_CODE=$?

          echo ""
          echo "========== BUILD SUMMARY =========="

          grep -n -E \
            "BUILD SUCCESSFUL|BUILD FAILED|What went wrong|Execution failed|Error:" \
            build.log | tail -n 80 || true

          echo ""
          echo "========== LAST 150 LOG LINES =========="

          tail -n 150 build.log

          echo ""
          echo "Build exit code: $BUILD_EXIT_CODE"

          exit $BUILD_EXIT_CODE

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SAKINA-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAKINA-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
