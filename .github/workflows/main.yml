name: Build SAKINA APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: flutter create --org com.hosny --project-name sakina --platforms=android .

      - name: Remove default test (references MyApp)
        run: rm -rf test

      - name: Patch Android (manifest, widget, adhan audio, gradle)
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Analyze (does not fail the build; read the log if build breaks)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAKINA-apk
          path: build/app/outputs/flutter-apk/app-release.apk
